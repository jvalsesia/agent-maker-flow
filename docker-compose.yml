services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amf-postgres
    environment:
      POSTGRES_USER: amf
      POSTGRES_PASSWORD: amf
      POSTGRES_DB: amf
    ports:
      - "5432:5432"
    volumes:
      - amf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amf -d amf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: amf-redis
    ports:
      - "6379:6379"
    volumes:
      - amf-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  amf-postgres-data:
  amf-redis-data:
