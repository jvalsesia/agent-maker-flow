server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip the text assets nginx serves.
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed, immutable build assets -> cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Proxy API calls to the backend service.
    # Override the upstream by templating/replacing this block per environment;
    # `backend` is the service name when run via docker-compose.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE: disable buffering + proxy timeout so streamed run events flow through.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # SPA history fallback — unknown paths resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
