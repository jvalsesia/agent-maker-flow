# nginx server block for the Zerops `web` service (referenced from zerops.yml
# via run.siteConfigPath). Mirrors frontend/nginx.conf.template, but targets
# the Zerops internal hostname `api:8080` instead of compose's `backend`, and
# uses a static root (no envsubst — Zerops provides the config verbatim).
server {
    listen       80;
    server_name  _;
    # Deploy root is /var/www; deployFiles keeps the `frontend/` prefix.
    root         /var/www/frontend/dist;
    index        index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed, immutable build assets -> cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Proxy API calls to the `api` service over the Zerops internal network.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;

        # SSE: disable buffering + long read timeout so run events stream through.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
    }

    # SPA history fallback — unknown paths resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
